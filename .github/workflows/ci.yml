name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same pull request, but never cancel a push
# to main: pushes have no `head_ref`, so they fall back to the unique
# `run_id` and each gets its own concurrency group. This stops the slow iOS
# Simulator job from being marked failed when several pushes land close
# together. See issue #8.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint --strict

  macos:
    name: Build & test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  ios:
    name: Build & test (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Build & test on iOS Simulator
        # ``CommandPaletteKit`` is build-only; ``CommandPaletteKit-Package`` includes tests.
        run: |
          xcodebuild test \
            -scheme CommandPaletteKit-Package \
            -destination 'platform=iOS Simulator,name=iPhone 16'

  prose:
    name: Vale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      # ai-tells bans em dashes and other AI-written prose patterns.  The style package is pinned in
      # ``.vale.ini`` and ``vale sync`` downloads it into the gitignored
      # ``styles`` directory.
      - name: Sync Vale styles
        run: uvx vale@3.13.0.0 sync
      - name: Lint prose
        run: git ls-files '*.md' | xargs --no-run-if-empty uvx vale@3.13.0.0

  performance:
    name: Performance regression (optional)
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Run large-catalog ranking test
        run: swift test --filter tenThousandCandidates

  documentation:
    name: Build DocC
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Generate documentation
        env:
          SWIFT_PACKAGE_ENABLE_DOCC: "1"
        run: |
          swift package --allow-writing-to-directory ./docs-site \
            generate-documentation \
            --target CommandPaletteKit \
            --include-extended-types \
            --disable-indexing \
            --output-path ./docs-site
